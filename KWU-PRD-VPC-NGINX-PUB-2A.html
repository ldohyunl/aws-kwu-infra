<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KWU-PRD-VPC-NGINX-PUB-2A</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='35' stroke='%2338bdf8' stroke-width='10' fill='none'/%3E%3Cline x1='20' y1='80' x2='80' y2='20' stroke='%2338bdf8' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.65);
            --card-border: rgba(56, 189, 248, 0.2);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --success-bg: rgba(56, 189, 248, 0.12);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 3rem 2.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(56, 189, 248, 0.05);
            border: 1px solid var(--card-border);
            max-width: 460px;
            width: 85%;
            animation: cubic-bezier(0.16, 1, 0.3, 1) fadeIn 1.2s;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: var(--success-bg); 
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 12px var(--accent-color), 0 0 4px var(--accent-color);
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 1rem 0;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-dim);
            line-height: 1.65;
            font-size: 0.95rem;
            font-weight: 400;
            margin: 0 0 2.5rem 0;
            word-break: keep-all;
        }

        .server-info {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 2rem;
        }

        .label {
            color: var(--text-dim);
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.725rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .value {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: -0.01em;
            text-shadow: 0 0 10px var(--accent-glow);
            background: rgba(56, 189, 248, 0.05);
            padding: 6px 14px;
            border-radius: 8px;
            display: inline-block;
            border: 1px solid rgba(56, 189, 248, 0.15);
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <div class="status-badge">
            <span class="status-dot"></span>
            Operational
        </div>
        
        <h1>KWU-PRD-VPC-NGINX-PUB-2A</h1>
        <p>The web server software is successfully installed and the content is being served correctly.</p>

        <div class="server-info">
            <span class="label">Server Identifier</span>
            <span class="value">KWU-PRD-VPC-NGINX-PUB-2A</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
        const fontSize = 12;
        let columns = canvas.width / fontSize;
        let drops = Array.from({ length: columns }).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.08)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#38bdf8'; 
            ctx.font = '500 ' + fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        const interval = setInterval(drawMatrix, 30);

        window.addEventListener('resize', () => {
            resizeCanvas();
            columns = canvas.width / fontSize;
            drops = Array.from({ length: columns }).fill(1);
        });
    </script>
</body>
</html>
